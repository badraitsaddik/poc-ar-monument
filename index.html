<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Monuments Casablanca AR - Texte</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
      
      <a-text
        value="Mosquee Hassan II"
        look-at="[gps-new-camera]"
        scale="20 20 20"
        gps-new-entity-place="latitude: 33.7045; longitude: -7.3652"
        position="0 30 0">
      </a-text>

      <a-text
        value="Twin Center Casablanca"
        look-at="[gps-new-camera]"
        scale="20 20 20"
        gps-new-entity-place="latitude: 33.5867; longitude: -7.6322"
        position="0 30 0">
      </a-text>

      <a-camera gps-new-camera rotation-reader near="0.1" far="3000"></a-camera>
      
    </a-scene>
  </body>
</html>
