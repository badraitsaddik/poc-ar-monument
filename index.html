<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Casablanca AR - Boussole Forcée</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      // 1. Vos coordonnées géographiques fixes
      const USER_LAT = 33.70540573637404;
      const USER_LON = -7.366791728814417;
      const MONUMENT_LAT = 33.70456832476546;
      const MONUMENT_LON = -7.365259276377008;

      // 2. Calcul mathématique de l'angle réel (Azimut) vers le monument
      function getAzimut(lat1, lon1, lat2, lon2) {
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const lat1Rad = lat1 * Math.PI / 180;
        const lat2Rad = lat2 * Math.PI / 180;
        const y = Math.sin(dLon) * Math.cos(lat2Rad);
        const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
      }

      const angleMonument = getAzimut(USER_LAT, USER_LON, MONUMENT_LAT, MONUMENT_LON);
      console.log("Le monument est à un angle réel de :", angleMonument, "degrés");

      // 3. Écoute de la boussole du téléphone en temps réel
      window.addEventListener('deviceorientation', function(event) {
        // 'alpha' donne la rotation du téléphone par rapport au Nord (0 à 360°)
        let compassHeading = event.webkitCompassHeading || Math.abs(event.alpha - 360);
        
        if (compassHeading !== null && compassHeading !== undefined) {
          // On récupère le conteneur du monument
          const pivot = document.getElementById('monument-pivot');
          
          if (pivot) {
            // On fait tourner TOUT l'espace virtuel pour aligner le Nord de la 3D avec le Nord réel
            // En A-Frame, la rotation Y (verticale) contrôle l'orientation droite/gauche
            pivot.setAttribute('rotation', `0 ${compassHeading - angleMonument} 0`);
          }
        }
      }, true);

      // Composant pour forcer le panneau à regarder l'utilisateur
      AFRAME.registerComponent('look-at-user', {
        tick: function () {
          this.el.object3D.lookAt(this.el.sceneEl.camera);
        }
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-entity id="monument-pivot" position="0 0 0">
          <a-entity position="0 1.5 -40" look-at-user>
            <a-plane width="25" height="8" color="#E60000" material="opacity: 0.9; transparent: true"></a-plane>
            <a-text value="MONUMENT CIBLE\nDistance ~165m" align="center" width="60" color="#FFFFFF" position="0 0 0.1"></a-text>
          </a-entity>
      </a-entity>

      <a-camera look-controls="enabled: false" wasd-controls="enabled: false" near="0.1" far="3000"></a-camera>
      
    </a-scene>
  </body>
</html>
