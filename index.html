<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Casablanca AR - Azimut Fixe</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      // Formule mathématique pour calculer l'angle de direction (Azimut) entre deux points GPS
      function calculerAzimut(lat1, lon1, lat2, lon2) {
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const lat1Rad = lat1 * Math.PI / 180;
        const lat2Rad = lat2 * Math.PI / 180;

        const y = Math.sin(dLon) * Math.cos(lat2Rad);
        const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
        
        let brng = Math.atan2(y, x) * 180 / Math.PI;
        return (brng + 360) % 360; // Retourne un angle entre 0° (Nord) et 360°
      }

      // Composant A-Frame personnalisé pour positionner le monument dans l'espace 3D
      AFRAME.registerComponent('oriente-monument', {
        schema: {
          vraiLat: {type: 'number'},
          vraiLon: {type: 'number'},
          userLat: {type: 'number'},
          userLon: {type: 'number'},
          distance: {type: 'number', default: 40} // Distance virtuelle d'affichage dans l'écran (en mètres)
        },
        init: function () {
          // 1. Calcul de l'angle réel vers le monument
          const angleDegres = calculerAzimut(this.data.userLat, this.data.userLon, this.data.vraiLat, this.data.vraiLon);
          console.log("Angle calculé vers le monument (Azimut) :", angleDegres, "degrés");
          
          // 2. Conversion en radians pour la trigonométrie 3D
          const angleRadians = (angleDegres * Math.PI) / 180;

          // 3. Calcul des coordonnées de l'espace 3D d'A-Frame (Axe X et Z)
          const x = this.data.distance * Math.sin(angleRadians);
          const z = -this.data.distance * Math.cos(angleRadians);

          // 4. On place le panneau (Y = 2 pour le mettre légèrement au-dessus du sol à hauteur d'yeux)
          this.el.setAttribute('position', `${x} 2 ${z}`);
        },
        tick: function () {
          // Force le panneau à toujours pivoter pour faire face à la caméra de l'utilisateur
          this.el.object3D.lookAt(this.el.sceneEl.camera);
        }
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-entity oriente-monument="userLat: 33.70540573637404; userLon: -7.366791728814417; vraiLat: 33.70456832476546; vraiLon: -7.365259276377008; distance: 40">
        <a-plane width="25" height="8" color="#E60000" material="opacity: 0.9; transparent: true"></a-plane>
        <a-text value="MONUMENT CIBLE\n~165m" align="center" width="65" color="#FFFFFF" position="0 0 0.1"></a-text>
      </a-entity>

      <a-camera rotation-reader near="0.1" far="3000"></a-camera>
      
    </a-scene>
  </body>
</html>
