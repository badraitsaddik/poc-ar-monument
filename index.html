<!DOCTYPE html>
<html>
  <head>
    <title>POC AR - Hassan II</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      .arjs-loader { height: 100%; width: 100%; position: absolute; top: 0; left: 0; background-color: rgba(0, 0, 0, 0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; }
      .arjs-loader div { text-align: center; font-size: 1.25em; color: white; }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <div class="arjs-loader"><div>Analyse de l'environnement en cours...</div></div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-nft
        type="nft"
        url="data/Hassan_II_mosque_Casablanca_2"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <a-text
          value="Mosquee Hassan II - Casablanca"
          color="yellow"
          position="50 150 -100"
          scale="100 100 100"
          align="center">
        </a-text>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
